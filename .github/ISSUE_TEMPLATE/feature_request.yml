name: Feature request
description: Suggest an improvement or a new primitive / modifier.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        TreLVis is a utility layer, not a framework. Please check the scope in CONTRIBUTING.md and the "Not planned" list in ROADMAP.md first. Requests from using TreLVis in a real product are especially welcome; leave out anything confidential about the product.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The design or code you want to express, ideally with its Figma / CSS equivalent.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      render: c
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today with raw LVGL?
      description: The code you write in its place, and how often it repeats.
      render: c
  - type: dropdown
    id: impact
    attributes:
      label: Would it change existing code?
      description: See "What a version number promises" in the README. A breaking change waits for the next major version.
      options:
        - Additive (new function, option, enum value or token field; existing code keeps working)
        - Breaking (changes or removes something existing code uses)
        - Docs or template only
        - Not sure
